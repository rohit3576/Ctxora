# RAG golden set (R1 baseline). Expectations reference demo/docs/*.md —
# tests/test_demo_docs.py locks the corpus facts these questions probe.
# `context` is prior conversation for followup-tagged cases: the baseline
# scores the bare question (the pain R2 fixes); post-R2 the rewrite uses it.
#
# R4a additions:
# - `contains` expectations pin answer text; is_hit demands every string in
#   the chunk body (case-insensitive).
# - table/procedure split cases probe GT-800 sections that exceed the chunk
#   window: key and answer sit >120 words apart across a chunk boundary, so
#   no current chunk holds both. They are expected to fail until chunker v2
#   (R4d) returns whole-section parents — that drop is the 4b baseline point.
# - version cases pin the newest revision of a family. Post-R4e only the
#   newest ACTIVE revision is searchable (older ones flip SUPERSEDED), so
#   these must hit at rank 1; regress to 0 if the lifecycle breaks.
#   err-e303-battery, battery-replace-part, and charge-1-8kg were originally
#   pinned to superseded revisions; R4e re-pins them to the newest revision
#   with contains canaries — if an obsolete doc ever leaks back into search,
#   its old answer text fails the contains check.

